name: Somente dono — segurança das automações

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "preview = verificar; apply = corrigir; audit = validar sem alterar"
        type: choice
        default: preview
        required: true
        options:
          - preview
          - apply
          - audit
      confirmar:
        description: "Para apply digite SOMENTE DONO"
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: wired-paradise-config
  cancel-in-progress: false

jobs:
  proteger:
    if: ${{ github.repository == 'hshsagaga1-commits/-wired-paradise-setup' && github.ref == 'refs/heads/main' && github.actor == 'hshsagaga1-commits' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar projeto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verificar testes de seguranca sem alterar Discord
        run: |
          python -m py_compile owner_only_security.py setup.py
          python -m unittest discover -s tests -v
      - name: Auditar ou aplicar protecao
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          WP_SECURITY_MODE: ${{ inputs.modo }}
          WP_SECURITY_CONFIRM: ${{ inputs.confirmar }}
        run: python owner_only_security.py
