name: Configurar Wired Paradise

# Execução somente manual: não expõe segredos em execuções automáticas de push.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Prévia e auditoria são somente leitura; Aplicar altera o servidor"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
          - audit
      confirmar:
        description: "Somente para aplicar: escreva APLICAR"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Impede configurações simultâneas.
concurrency:
  group: wired-paradise-config
  cancel-in-progress: false

jobs:
  configurar:
    # Apenas o proprietário, na branch principal e neste repositório específico.
    if: ${{ github.repository == 'hshsagaga1-commits/-wired-paradise-setup' && github.ref == 'refs/heads/main' && github.actor == 'hshsagaga1-commits' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar projeto (dependência fixada)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar Python (dependência fixada)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verificar regras e permissões
        run: python -m unittest discover -s tests -v
      - name: Executar configuração manual
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          WP_MODE: ${{ inputs.modo }}
          WP_CONFIRMATION: ${{ inputs.confirmar }}
        run: python setup.py
