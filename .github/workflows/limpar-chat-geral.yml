name: Limpar chat-geral (Wired Paradise)

# Manual only: no scheduled runs, no push-triggered deletions.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "preview = só contar; apply = apagar mensagens permanentemente"
        type: choice
        default: preview
        required: true
        options:
          - preview
          - apply
      limite:
        description: "Máximo de mensagens examinadas/apagadas por execução"
        type: choice
        default: '500'
        required: true
        options:
          - '100'
          - '500'
          - '2000'
      confirmar:
        description: "Para apply, escreva APAGAR CHAT-GERAL (apaga até mensagens fixadas)"
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: wired-paradise-config
  cancel-in-progress: false

jobs:
  limpar:
    if: ${{ github.repository == 'hshsagaga1-commits/-wired-paradise-setup' && github.ref == 'refs/heads/main' && github.actor == 'hshsagaga1-commits' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar projeto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Testar segurança sem apagar mensagens
        run: |
          python -m py_compile setup.py purge_chat.py
          python -m unittest discover -s tests -v
      - name: Verificar confirmação e executar
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          WP_PURGE_MODE: ${{ inputs.modo }}
          WP_PURGE_LIMIT: ${{ inputs.limite }}
          WP_PURGE_CONFIRM: ${{ inputs.confirmar }}
        run: python purge_chat.py
